[project]
name = "tacme"
version = "1.0.0"
description = "TACME: Task-Aware Cross-Modal Experts for Disjoint-Corpus Multimodal Behavioral Understanding."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "gradio>=6.31.0,<7.0.0",
    "packaging>=26.3,<27.0",
    "pillow>=12.3.0",
    "plotly[kaleido]>=7.1.0,<8.0.0",
    "psutil>=7.2.2",
    "safetensors>=0.8.0,<0.9.0",
    "torch>=2.15.0,<3.0.0",
    "torchvision>=0.29.2,<0.30.0",
    "torchcodec>=0.17.0,<0.18.0",
    "transformers>=5.22.1",
    "qwen-vl-utils>=0.0.14,<0.1.0",
]


[dependency-groups]
dev = [
    "deptry>=0.25.1,<0.26.0",
    "mypy>=2.4.1,<3.0.0",
    "pre-commit>=4.7.0",
    "ruff>=0.17.3,<0.18.0",
    "types-psutil>=7.2.2.20260906",
    "types-pyyaml>=6.0.12.20261030",
]


[tool.uv]
package = false
required-version = ">=0.12.13"
default-groups = [ "dev" ]


[tool.ruff]
line-length = 120
target-version = "py314"
show-fixes = true
src = [ "." ]

exclude = [ ".venv", "node_modules", "__pycache__", ".mypy_cache", ".ruff_cache", ".pytest_cache", "build", "dist" ]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.ruff.lint]
select = [ "E", "W", "F", "I", "B", "UP", "SIM", "C4", "A", "TID", "RUF" ]

ignore = [ "E501", "E111", "E114", "E117", "W191", "RUF003" ]

fixable = [ "ALL" ]
unfixable = [  ]


[tool.ruff.lint.per-file-ignores]
"__init__.py" = [ "F401" ]


[tool.ruff.lint.isort]
known-first-party = [ "tacme" ]
combine-as-imports = true
force-sort-within-sections = true
split-on-trailing-comma = true


[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"


[tool.mypy]
python_version = "3.14"
files = [ "app.py", "tacme", "scripts" ]
exclude = "(^\\.venv/|^build/|^dist/)"
strict = true
pretty = true
show_error_codes = true
show_column_numbers = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
warn_return_any = true
namespace_packages = true
explicit_package_bases = true


[[tool.mypy.overrides]]
module = [ "plotly", "plotly.*", "qwen_vl_utils", "qwen_vl_utils.*" ]
ignore_missing_imports = true

[tool.deptry.per_rule_ignores]
DEP002 = [ "qwen-vl-utils", "torchcodec", "torchvision" ]
